<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Scanner (Local, No API)</title>
<style>
  :root { --pad: 16px; --radius: 14px; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
         max-width: 560px; margin: 0 auto; padding: var(--pad); line-height: 1.35; }
  video { width: 100%; border-radius: var(--radius); background: #111; }
  .row { display: grid; gap: 8px; }
  button, input[type="file"] { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #ddd; font-size: 16px; background: #fafafa; cursor: pointer; }
  button.primary { background: #0ea5e9; color: white; border-color: #0ea5e9; }
  pre#out { background: #f6f6f6; padding: 12px; border-radius: 8px; min-height: 2.5em; white-space: pre-wrap; }
  .hint { font-size: .9rem; color: #555; }
  .card { background: white; border: 1px solid #eee; border-radius: var(--radius); padding: var(--pad); }
</style>

<h2>Scan a QR code</h2>
<div class="card row">
  <video id="video" playsinline muted></video>
  <div class="row">
    <button id="start" class="primary">Start camera scan</button>
    <input id="file" type="file" accept="image/*" capture="environment">
  </div>
  <pre id="out" aria-live="polite"></pre>
  <div class="row">
    <button id="copy">Copy decoded text</button>
    <button id="return">Return to app</button>
  </div>
  <p class="hint">If the camera doesn’t show inside an embed, open this page in a new tab.</p>
</div>

<script type="module">
import { BrowserQRCodeReader } from "https://cdn.jsdelivr.net/npm/@zxing/browser@latest/+esm";

const reader = new BrowserQRCodeReader();
const out = document.getElementById('out');
const video = document.getElementById('video');

document.getElementById('start').onclick = async () => {
  try {
    const result = await reader.decodeOnceFromVideoDevice(undefined, video);
    out.textContent = result.getText();
    reader.stopStreams();
  } catch (e) {
    out.textContent = 'Camera error or no QR found.';
  }
};

document.getElementById('file').onchange = async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    const result = await reader.decodeFromImageUrl(url);
    out.textContent = result.getText();
  } catch {
    out.textContent = 'No QR found in image.';
  } finally {
    URL.revokeObjectURL(url);
  }
};

document.getElementById('copy').onclick = async () => {
  await navigator.clipboard.writeText(out.textContent || '');
  alert('Copied!');
};

// Optional: return to your Glide deep link with ?qr=<decodedText>
const params = new URLSearchParams(location.search);
const returnUrl = params.get('return'); // add ?return=<your-glide-deeplink> when opening this page
document.getElementById('return').onclick = () => {
  if (!returnUrl) { alert('Add ?return=<your-glide-deeplink> to the URL'); return; }
  const qr = encodeURIComponent(out.textContent || '');
  location.href = `${returnUrl}${returnUrl.includes('?') ? '&' : '?'}qr=${qr}`;
};
</script>
